name: Generate Pacman Monster Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pacman + Monsters
        uses: Platane/snk@v3
        with:
          github_user_name: Classicharsh
          outputs: |
            dist/pacman.svg?color_snake=yellow&speed=6&color_dots=#ff0000,#00bfff,#ff69b4,#ffa500
            dist/pacman-dark.svg?palette=github-dark&color_snake=yellow&speed=6&color_dots=#ff0000,#00bfff,#ff69b4,#ffa500
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
